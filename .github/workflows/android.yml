name: Android CI

on:
  push:
    branches: [ main, 'chore/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Le build tourne sans google-services.json : les plugins Firebase ne sont
      # alors pas appliqués. Voir README, section « Activer Firebase ».

      - name: Publier les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/
          retention-days: 7

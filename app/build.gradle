plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.ksp)
}

// Firebase n'est branché que si google-services.json est présent. Le fichier a été retiré du
// dépôt lors de la purge de secrets ; voir google-services.json.example et le README.
def firebaseConfig = file('google-services.json')
def hasFirebase = firebaseConfig.exists()
if (hasFirebase) {
    apply plugin: libs.plugins.google.services.get().pluginId
    apply plugin: libs.plugins.firebase.crashlytics.get().pluginId
} else {
    logger.lifecycle('GoodWine : google-services.json absent — Firebase desactive pour ce build.')
}

android {
    namespace 'com.elfefe.goodwine'
    compileSdk 35

    defaultConfig {
        applicationId "com.elfefe.goodwine"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        buildConfigField "boolean", "FIREBASE_ENABLED", "${hasFirebase}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

